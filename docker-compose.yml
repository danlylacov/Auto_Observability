# =============================================================================
# JWT и первый вход (users_api + api_agregator)
# -----------------------------------------------------------------------------
# Общий секрет для подписи токенов (обязательно смените в проде):
#   export JWT_SECRET="$(openssl rand -hex 32)"
# или в файле .env в КОРНЕ репозитория (рядом с этим compose): JWT_SECRET=...
# Compose подставляет ${JWT_SECRET} в users_api и api_agregator — значения
# должны совпадать. Блок environment ниже перекрывает JWT_* из api_agregator/.env.
#
# Первый пользователь maintainer (создаётся при старте users_api, если в БД
# ещё нет роли maintainer):
#   MAINTAINER_USERNAME   (по умолчанию maintainer)
#   MAINTAINER_PASSWORD   (по умолчанию changeme)
# Вход в веб-интерфейс: http://localhost:3000/login — эти же логин и пароль.
#
# api_agregator: при желании скопируйте api_agregator/.env.example →
# api_agregator/.env (доп. переменные). JWT для контейнеров задаётся в compose;
# env_file для api_agregator опционален (required: false).
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: auto_observability_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
    # ports:
    #   - "5433:5432"  # Доступ только внутри Docker сети
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: auto_observability_redis
    # ports:
    #   - "6379:6379"  # Доступ только внутри Docker сети
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: auto_observability_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app_network

  # Users + JWT auth (логин /me /users; тот же JWT_SECRET, что у api_agregator)
  users_api:
    build:
      context: ./users_api
      dockerfile: Dockerfile
    container_name: auto_observability_users_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
      # Должен совпадать с JWT_SECRET у api_agregator (см. шапку файла).
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      # Учётка для первого входа в UI и для POST /api/v1/users (только maintainer).
      MAINTAINER_USERNAME: ${MAINTAINER_USERNAME:-maintainer}
      MAINTAINER_PASSWORD: ${MAINTAINER_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - "${USERS_API_HOST_PORT:-8082}:8000"

  # API Aggregator
  api_agregator:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_api_agregator
    env_file:
      - path: ./api_agregator/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Переменные для подключения к PostgreSQL (если не указаны в .env)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
      # Переменные для подключения к Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # URLs для внешних сервисов (используем имена Docker сервисов)
      PROMETHEUS_GENERATION_URL: http://prometheus_generation:8000
      DOCKER_API_URL: http://docker_api:8000
      PROMETHEUS_MANAGER_URL: http://prometheus_manager:8000
      GRAFANA_MANAGER_URL: http://grafana_manager:8000
      DOCKER_CLASSIFICATION_API_URL: http://docker_classification:8000
      GRAFANA_GENERATION_URL: http://grafana_generation:8000
      # Тот же секрет, что у users_api (иначе 401 на /api/v1/*).
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
    ports:
      - "8081:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      grafana_manager:
        condition: service_healthy
      grafana_generation:
        condition: service_healthy
      users_api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker 1
  api_agregator_celery_worker_1:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_worker_1
    env_file:
      - path: ./api_agregator/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PROMETHEUS_GENERATION_URL: http://prometheus_generation:8000
      DOCKER_API_URL: http://docker_api:8000
      PROMETHEUS_MANAGER_URL: http://prometheus_manager:8000
      DOCKER_CLASSIFICATION_API_URL: http://docker_classification:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_ALGORITHM: HS256
    command: celery -A app.celery_app worker --loglevel=info --hostname=worker1@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  # Celery Worker 2
  api_agregator_celery_worker_2:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_worker_2
    env_file:
      - path: ./api_agregator/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PROMETHEUS_GENERATION_URL: http://prometheus_generation:8000
      DOCKER_API_URL: http://docker_api:8000
      PROMETHEUS_MANAGER_URL: http://prometheus_manager:8000
      DOCKER_CLASSIFICATION_API_URL: http://docker_classification:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_ALGORITHM: HS256
    command: celery -A app.celery_app worker --loglevel=info --hostname=worker2@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  # Celery Beat
  api_agregator_celery_beat:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_beat
    env_file:
      - path: ./api_agregator/.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_observability
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PROMETHEUS_GENERATION_URL: http://prometheus_generation:8000
      DOCKER_API_URL: http://docker_api:8000
      PROMETHEUS_MANAGER_URL: http://prometheus_manager:8000
      DOCKER_CLASSIFICATION_API_URL: http://docker_classification:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string}
      JWT_ALGORITHM: HS256
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./api_agregator:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  # Docker Classification
  docker_classification:
    build:
      context: ./docker_classification
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_docker_classification
    env_file:
      - ./docker_classification/.env
    environment:
      - SKIP_ENV_FILE_CHECK=true
    ports:
      - "8001:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker API
  docker_api:
    build:
      context: ./docker_api
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_docker_api
    ports:
      - "8004:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Generation
  prometheus_generation:
    build:
      context: ./prometheus_generation
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_prometheus_generation
    env_file:
      - ./prometheus_generation/.env
    environment:
      SKIP_ENV_FILE_CHECK: "true"
      # MinIO настройки
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USR: minioadmin
      MINIO_PWD: minioadmin
    volumes:
      - ./signatures.yml:/app/signatures.yml
    ports:
      - "8002:8000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Manager
  prometheus_manager:
    build:
      context: ./prometheus_manager
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_prometheus_manager
    env_file:
      - ./prometheus_manager/.env
    environment:
      SKIP_ENV_FILE_CHECK: "true"
      # MinIO настройки
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USR: minioadmin
      MINIO_PWD: minioadmin
      # Путь к конфигурации Prometheus на хосте
      PROMETHEUS_CONFIG_HOST_PATH: /home/daniil/Рабочий стол/диплом/Auto_Observability/prometheus_manager/app/services/prometheus
    ports:
      - "8003:8000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./prometheus_manager/app/services/prometheus:/app/app/services/prometheus
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana container start/stop (Docker on host / socket)
  grafana_manager:
    build:
      context: ./grafana_manager
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_grafana_manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8005:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana dashboard generation + import API
  grafana_generation:
    build:
      context: ./grafana_generation
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_grafana_generation
    environment:
      # По умолчанию как в grafana_manager/grafana_settings.yml (Grafana на хосте :3052)
      GRAFANA_URL: ${GRAFANA_URL:-http://host.docker.internal:3052}
      GRAFANA_USER: ${GRAFANA_USER:-admin}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD:-Passw0rd}
      DEFAULT_PROMETHEUS_DS_UID: ${DEFAULT_PROMETHEUS_DS_UID:-prometheus}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./signatures.yml:/app/signatures.yml
    # Порт только при отладке; api_agregator ходит на http://grafana_generation:8000 внутри сети.
    ports:
      - "${GRAFANA_GENERATION_HOST_PORT:-18010}:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (пустой VITE_API_URL → запросы на тот же origin /api/* через nginx:
  # /api/v1/auth и /api/v1/users → users_api, остальное → api_agregator)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        # Пустая строка: axios → относительные URL /api/* через nginx (auth → users_api).
        VITE_API_URL: ""
        VITE_GRAFANA_EXTERNAL_URL: ${VITE_GRAFANA_EXTERNAL_URL:-http://localhost:3052}
    container_name: auto_observability_frontend
    ports:
      - "3000:80"
    depends_on:
      api_agregator:
        condition: service_healthy
      users_api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

