services:
  postgres:
    image: postgres:15-alpine
    container_name: auto_observability_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: auto_observability_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio:
    image: minio/minio:latest
    container_name: auto_observability_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app_network

  users_api:
    build:
      context: ./users_api
      dockerfile: Dockerfile
    container_name: auto_observability_users_api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    ports:
      - "${USERS_API_HOST_PORT:-8082}:8000"

  api_agregator:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_api_agregator
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      grafana_manager:
        condition: service_healthy
      grafana_generation:
        condition: service_healthy
      users_api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api_agregator_celery_worker_1:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_worker_1
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app worker --loglevel=info --hostname=worker1@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  api_agregator_celery_worker_2:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_worker_2
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app worker --loglevel=info --hostname=worker2@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  api_agregator_celery_beat:
    build:
      context: ./api_agregator
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_celery_beat
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./api_agregator:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api_agregator:
        condition: service_healthy
    networks:
      - app_network

  docker_classification:
    build:
      context: ./docker_classification
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_docker_classification
    ports:
      - "8001:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  docker_api:
    build:
      context: ./docker_api
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_docker_api
    env_file:
      - path: ./docker_api/.env
        required: false
    ports:
      - "8004:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus_generation:
    build:
      context: ./prometheus_generation
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_prometheus_generation
    env_file:
      - .env
    volumes:
      - ./signatures.yml:/app/signatures.yml
    ports:
      - "8002:8000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus_manager:
    build:
      context: ./prometheus_manager
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_prometheus_manager
    env_file:
      - .env
    ports:
      - "8003:8000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./prometheus_manager/app/services/prometheus:/app/app/services/prometheus
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana_manager:
    build:
      context: ./grafana_manager
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_grafana_manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8005:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana_generation:
    build:
      context: ./grafana_generation
      dockerfile: Dockerfile
      network: host
    container_name: auto_observability_grafana_generation
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./signatures.yml:/app/signatures.yml
    ports:
      - "${GRAFANA_GENERATION_HOST_PORT:-18010}:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ""
        VITE_GRAFANA_EXTERNAL_URL: ${VITE_GRAFANA_EXTERNAL_URL}
    container_name: auto_observability_frontend
    ports:
      - "3000:80"
    depends_on:
      api_agregator:
        condition: service_healthy
      users_api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
